<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School topics as videos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="headtop">
      <div>
        <h1>School topics as videos</h1>
        <div class="sub" id="count">Loading…</div>
      </div>
      <div class="headright">
        <nav class="nav" aria-label="Pages">
          <a href="index.html" class="on" aria-current="page">Videos</a>
          <a href="create.html">Create &amp; upload</a>
        </nav>
        <div class="chips" role="group" aria-label="Filter by language">
          <button class="chip" data-lang="" aria-pressed="true">All</button>
          <button class="chip" data-lang="ru" aria-pressed="false">Русский</button>
          <button class="chip" data-lang="en" aria-pressed="false">English</button>
        </div>
      </div>
    </div>
    <div class="searchrow headsearch">
      <label class="box">
        <span class="icon">⌕</span>
        <input type="text" id="search" placeholder="Find a topic: density, fractions, water cycle…"
               aria-label="Find a topic" autocomplete="off">
        <button type="button" class="clear" id="clearSearch" aria-label="Clear search" hidden>×</button>
        <kbd>/</kbd>
      </label>
    </div>
  </header>

  <section id="now" aria-live="polite">
    <div class="playerbox">
      <video id="player" controls playsinline preload="metadata"></video>
      <div class="midq" id="midq" hidden aria-live="assertive"></div>
    </div>
    <div class="nowbar">
      <div>
        <h2 id="nowTitle"></h2>
        <div class="meta" id="nowMeta"></div>
      </div>
      <div class="spacer"></div>
      <a class="ghost" id="download" download>Download</a>
      <button class="ghost" id="testBtn" hidden>Test</button>
      <button class="ghost" id="close">Close</button>
    </div>
    <div class="quiz" id="quiz" hidden aria-live="polite"></div>
  </section>

  <div class="filterbar" id="filterbar">
    <div class="searchrow gradebar">
      <span class="gradehint">Subject</span>
      <div class="chips" id="courses" role="group" aria-label="Filter by subject"></div>
    </div>

    <div class="searchrow gradebar">
      <span class="gradehint">Grade</span>
      <div class="chips" id="grades" role="group" aria-label="Filter by grade"></div>
      <span class="gradehint" id="gradeHint"></span>
    </div>
  </div>

  <div class="ideas" id="ideas" hidden>
    <h3 id="ideaTitle"></h3>
    <div class="chips" id="ideachips"></div>
  </div>

  <main class="grid" id="grid"></main>
  <div class="empty" id="empty" hidden>No videos in this language yet.</div>
  <footer id="foot"></footer>
</div>

<script src="common.js"></script>
<script src="gallery.js"></script>

</body>
</html>
